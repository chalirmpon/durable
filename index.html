html[data-theme="indigo"]{--pri:#3d35a6;--pri2:#5b54d6;--pri-t:#ecebfa;--pri-d:#2c2580;--hd1:#272078;--hd2:#4a42c4;--hdlite:#ecebfa;--pri-rgb:61,53,166;--c1:#3d35a6;

--bg:#f1f5fa;--line:#dde5ef;--line2:#eaf0f6;--soft:#f5f8fc;--soft2:#e9eff6;--line3:#cfdae8;--ink:#17233a;--ink2:#334058;--mute:#5f6b80}

--ok:#3ccf8e;--ok-t:#10302a;--ok-b:#1f5a45;--ok-ink:#a9ecca;--warn:#f0b04a;--warn-t:#332710;--warn-b:#5f4719;--warn-ink:#f6d69b;--bad:#ff6b6b;--bad-t:#3a1a20;--bad-b:#6b2c34;--bad-ink:#ffb3b3;
--info:#63a9ff;--info-t:#13263f;--info-b:#254b78;--info-ink:#b7d5ff;--pur:#a58bff;--pur-t:#2a2145;--pur-ink:#cdbcff;--hdlite:#0e1120;

--c1:#20b394;--c2:#63a9ff;--c3:#f0b04a;--c4:#ff6b6b;--c5:#a58bff;--c6:#38c7c9;--c7:#c4a093;--c8:#f06292;--c9:#9ab0bd}

/* แบบฟอร์ม / รายงานที่พิมพ์ / ป้าย QR: สีเดิม (พื้นขาว) ทุกธีมทุกโหมด */
.doc,.paper,#printArea,.lab,.lbl{--bg:#ffffff;--card:#ffffff;--soft:#f6f9f8;--soft2:#eef2f1;--ink:#000000;--ink2:#222222;--mute:#555555;--line:#cccccc;--line2:#eeeeee;--line3:#bbbbbb;
--pri:#0f6b5c;--pri2:#16846f;--pri-t:#e3f3ef;--pri-tx:#0f6b5c;--ok:#1f8a55;--warn:#a85f00;--bad:#bf3326;--info:#1c66ad;color-scheme:light}
/* ตัวเลือกธีม */
.thg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.thc{border:2px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;background:var(--card);text-align:center;font-weight:600;font-size:13.5px;color:var(--ink)}
.thc.on{border-color:var(--pri);box-shadow:0 0 0 3px rgba(var(--pri-rgb),.22)}
.thc i{display:block;height:44px;border-radius:10px;margin-bottom:6px}
.thc i b{display:block;height:12px;width:44%;margin:16px auto 0;border-radius:6px;background:rgba(255,255,255,.85)}
@media (max-width:520px){.thg{grid-template-columns:repeat(2,minmax(0,1fr))}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Sarabun','IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
a{color:var(--info)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* ---------- top bar ---------- */
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;height:var(--top);padding:0 16px;background:linear-gradient(90deg,var(--hd1),var(--hd2));color:#fff;box-shadow:0 2px 12px rgba(6,40,30,.18)}
#top .logo{width:46px;height:46px;border-radius:12px;object-fit:contain;background:#fff;padding:3px;flex:none}
#top .tt{min-width:0;flex:1;line-height:1.28}
#top .tt b{display:block;font-size:17.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .tt small{display:block;opacity:.86;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpill{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;min-width:38px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.tpill:hover{background:rgba(255,255,255,.22)}
.tpill.tfy{cursor:default;background:rgba(255,255,255,.08)}
.tpill.twarn{background:#f7c548;border-color:#f7c548;color:#3a2900}
.tpill.twarn:hover{background:#ffd462}
#who{max-width:230px;padding:0 14px 0 5px}
#who .av{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--hd1);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;flex:none}
#who .tl{overflow:hidden;text-overflow:ellipsis}
@media (max-width:1240px){.tpill .tl{display:none}.tpill{padding:0 11px}#who{padding:0 5px}}
.tpill.fsb svg{width:18px;height:18px;display:block}
.ibtn{border:1px solid var(--line);background:var(--card);border-radius:10px;height:38px;min-width:38px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ibtn:hover{background:var(--line2)}
/* ---------- side nav ---------- */
#side{position:fixed;top:var(--top);bottom:0;left:0;width:var(--side);background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px 20px;z-index:20}
#side .nv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:14.5px;color:var(--ink)}
#side .nv:hover{background:var(--line2)}
#side .nv.on{background:var(--pri);color:var(--on-pri);font-weight:600}
#side .nv i{font-style:normal;width:22px;text-align:center}
#side .nv .bd{margin-left:auto}
#side .grp{font-size:11.5px;color:var(--mute);padding:12px 12px 4px;letter-spacing:.02em}
#side .foot{color:var(--mute);font-size:11.5px;padding:16px 12px 0}
#main{margin-left:var(--side);padding:18px 22px 40px;max-width:1460px}
/* ---------- bottom nav (mobile) ---------- */
#bnav{display:none}
/* ---------- โหมดแอป (< 1024 px) แบบแอป AppSheet: แถบบน ☰ | ชื่อหน้า | 🔍 🔔 ⛶ 🎨 • แท็บล่าง 5 แท็บ • เมนูลิ้นชัก • ปุ่มลอย ---------- */
#abar,#tabs,#fab{display:none}
@media (max-width:1023px){
  :root{--top:58px}
  #top,#side{display:none}
  #abar{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:0;height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 2px 0 4px;background:var(--pri);color:var(--on-pri);box-shadow:0 2px 8px rgba(var(--pri-rgb),.3)}
  html[data-mode="dark"] #abar{background:var(--hd2)}
  .abt{flex:1;min-width:0;line-height:1.2;padding:0 6px}
  .abt b{display:block;font-size:17.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .abt small{display:block;font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #main{margin-left:0;padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
  #tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);height:calc(62px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(0,0,0,.05)}
  #tabs button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--mute);cursor:pointer;position:relative;font-family:inherit}
  #tabs button i{font-style:normal;font-size:19px;line-height:1;width:54px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
  #tabs button.on{color:var(--pri-tx);font-weight:700}
  #tabs button.on i{background:var(--pri-t)}
  #tabs .bd{position:absolute;top:2px;right:calc(50% - 28px)}
  #fab{display:flex;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:41;height:52px;min-width:52px;padding:0 18px;border:0;border-radius:26px;background:var(--pri);color:var(--on-pri);font-size:15px;font-weight:700;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 18px rgba(var(--pri-rgb),.4);cursor:pointer;font-family:inherit}
  #toast{bottom:calc(140px + env(safe-area-inset-bottom))}   /* เหนือแถบล่าง + ปุ่ม + */
  #fab.hidden{display:none}
  /* ชื่อหน้าอยู่บนแถบบนแล้ว — หัวหน้าเพจเหลือเฉพาะตัวเลือก / ปุ่มของหน้า */
  #main h1.vt{font-size:0;margin:0 0 10px;gap:8px}
  #main h1.vt>*{font-size:14px}
  #main h1.vt>small,#main h1.vt>.grow{display:none}
  #main h1.vt:not(:has(>:not(small):not(.grow))){display:none}
  #main h1.vt [data-act="loanPick"],#main h1.vt [data-act="newItem"],#main h1.vt [data-act="chkScan"]{display:none}
  /* ตารางกว้าง → การ์ด */
  .tw.mc{max-height:none!important;overflow:visible}
  .tw.mc thead{display:none}
  .tw.mc table.tbl,.tw.mc table.tbl tbody,.tw.mc table.tbl tfoot,.tw.mc table.tbl tr{display:block;width:100%}
  .tw.mc table.tbl tr{border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:6px 10px;background:var(--card)}
  .card.pad0 .tw.mc{padding:0 8px}
  .tw.mc table.tbl td{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border:0;padding:3px 0;text-align:right;white-space:normal}
  .tw.mc table.tbl td::before{content:attr(data-label);color:var(--mute);font-size:12px;text-align:left;flex:none;max-width:46%}
  .tw.mc table.tbl td:first-child{font-weight:700}
  .tw.mc table.tbl td:empty{display:none}
}
.abtn{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:none;color:inherit;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0}
.abtn:active{background:rgba(255,255,255,.18)}
.abtn svg{width:24px;height:24px;display:block}
.abn{position:absolute;top:4px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#f7c548;color:#3a2900;font-size:11px;font-weight:700;line-height:18px;text-align:center}
#abL.pend::after{content:'';position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:#ff5a4a;box-shadow:0 0 0 2px var(--pri)}
/* เมนูลิ้นชัก (มือถือ) */
#drawer{position:fixed;inset:0;z-index:90}
#drawer.hidden{display:none}
#drawer .dback{position:absolute;inset:0;background:rgba(0,0,0,.42);animation:dFade .15s}
#drawer .dpanel{position:absolute;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--card);color:var(--ink);overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom));box-shadow:4px 0 24px rgba(0,0,0,.25);animation:dSlide .18s ease-out}
@keyframes dSlide{from{transform:translateX(-100%)}to{transform:none}}
@keyframes dFade{from{opacity:0}to{opacity:1}}
.dpanel .dhead{background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 14px}
.dpanel .dhead img{width:52px;height:52px;border-radius:14px;background:#fff;padding:3px;object-fit:contain;display:block}
.dpanel .dhead b{display:block;font-size:17px;margin-top:8px}
.dpanel .dhead small{display:block;opacity:.88;font-size:12px;line-height:1.45}
.dpanel .dhead .du{margin-top:10px;font-size:12.5px;background:rgba(255,255,255,.14);border-radius:10px;padding:6px 10px}
.dgrp{font-size:11.5px;color:var(--mute);padding:12px 16px 4px}
.dpanel a{display:flex;align-items:center;gap:12px;padding:11px 16px;color:var(--ink);text-decoration:none;font-size:15px;cursor:pointer}
.dpanel a:active,.dpanel a.on{background:var(--pri-t);color:var(--pri-tx);font-weight:600}
.dpanel a .ni{width:24px;text-align:center;flex:none}
.dpanel a .bd,.dpanel a .chip{margin-left:auto}
.dpanel .dsep{height:1px;background:var(--line);margin:8px 0}
.dpanel .dcr{font-size:11.5px;color:var(--mute);padding:12px 16px;line-height:1.6}
/* ---------- โหมดแอปแบบคลังยา V9 (รุ่น 1.6.0): ไอคอนเส้น • รายการแบบ AppSheet • สแกนเต็มจอ ---------- */
#tabs button i svg{width:24px;height:24px;display:block}
.ni{display:inline-flex;align-items:center;justify-content:center;color:var(--mute)}
.ni svg{width:22px;height:22px;display:block}
.dpanel a.on .ni,.dpanel a:active .ni{color:var(--pri-tx)}
.dpanel a.dout,.dpanel a.dout .ni{color:var(--bad-ink,var(--bad))}
.mlink{border:0;background:none;color:var(--pri-tx);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:4px 2px;display:inline-flex;align-items:center;gap:6px}
.mlink svg{width:18px;height:18px}
#mTitle svg{width:20px;height:20px;vertical-align:-3px}
.mform .f{margin-top:10px}.mform .f:first-child{margin-top:0}
.mform .inp,.mform select{width:100%}
.mform .row .inp,.mform .row select{flex:1;min-width:130px}
@keyframes laser{from{top:18%}to{top:82%}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@media (max-width:1023px){
  .abt b{font-size:20px}
  .abt small{font-size:12.5px}
  #tabs button{font-size:12px}
  /* รายการครุภัณฑ์ */
  .mlist{margin:-12px -12px 0}
  .msb{position:sticky;top:calc(var(--top) + env(safe-area-inset-top));z-index:20;display:flex;align-items:center;gap:4px;padding:8px 6px 8px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
